<!doctype html>
<html lang="pt">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>POC Journal</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d0d0d;color:#e0e0e0;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:16px 24px;display:flex;align-items:center;gap:12px}
header h1{font-size:1.1rem;font-weight:600;color:#fff;letter-spacing:.5px}
header span{font-size:.75rem;color:#555;margin-left:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:20px 24px}
.stat{background:#161616;border:1px solid #222;border-radius:10px;padding:14px 16px}
.stat label{font-size:.68rem;color:#666;text-transform:uppercase;letter-spacing:.8px}
.stat .val{font-size:1.6rem;font-weight:700;margin-top:4px;line-height:1}
.stat .sub{font-size:.72rem;color:#555;margin-top:3px}
.green{color:#26a69a}.red{color:#ef5350}.orange{color:#ffa000}.white{color:#fff}
.section{padding:0 24px 24px}
.section h2{font-size:.78rem;text-transform:uppercase;letter-spacing:1px;color:#555;margin-bottom:12px}
canvas{width:100%!important;height:180px!important;background:#111;border:1px solid #1e1e1e;border-radius:10px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters select,.filters input{background:#161616;border:1px solid #2a2a2a;color:#ccc;padding:6px 10px;border-radius:6px;font-size:.8rem;outline:none}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead tr{background:#111;position:sticky;top:0}
th{padding:10px 12px;text-align:left;color:#555;font-weight:500;border-bottom:1px solid #1e1e1e;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #181818;white-space:nowrap}
tr:hover td{background:#131313}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}
.badge.OPEN{background:#1a2a1a;color:#4caf50}
.badge.TP_HIT{background:#1a2e1a;color:#26a69a}
.badge.SL_HIT{background:#2e1a1a;color:#ef5350}
.badge.LONG{background:#1a2533;color:#42a5f5}
.badge.SHORT{background:#2e1a2e;color:#ab47bc}
.pnl.pos{color:#26a69a}.pnl.neg{color:#ef5350}
.open-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:24px}
.open-card{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:14px}
.open-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.open-card .ticker{font-weight:700;font-size:.95rem}
.open-card .levels{font-size:.75rem;color:#666;line-height:1.7}
.open-card .levels span{color:#aaa}
.progress-bar{height:4px;background:#1e1e1e;border-radius:2px;margin-top:10px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .4s}
#empty{text-align:center;color:#333;padding:48px;font-size:.85rem}
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffa000" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
  <h1>POC Journal — Paper Trades</h1>
  <span id="last-update">—</span>
</header>

<div class="stats" id="stats-row">
  <div class="stat"><label>Total Setups</label><div class="val white" id="s-total">—</div></div>
  <div class="stat"><label>Abertos</label><div class="val orange" id="s-open">—</div></div>
  <div class="stat"><label>Win Rate</label><div class="val green" id="s-wr">—</div><div class="sub" id="s-wl">— W / — L</div></div>
  <div class="stat"><label>Profit Factor</label><div class="val" id="s-pf">—</div></div>
  <div class="stat"><label>P&L Total</label><div class="val" id="s-pnl">—</div></div>
  <div class="stat"><label>Paper Equity</label><div class="val white" id="s-eq">—</div><div class="sub">início: 1 000 USDT · 10%/trade</div></div>
</div>

<div class="section">
  <h2>Equity Curve</h2>
  <canvas id="chart"></canvas>
</div>

<div class="section">
  <h2>Trades Abertos</h2>
  <div class="open-list" id="open-list"><p id="empty-open" style="color:#333;font-size:.8rem">Nenhum trade aberto.</p></div>
</div>

<div class="section">
  <h2>Histórico</h2>
  <div class="filters">
    <select id="f-side"><option value="">Direção</option><option>LONG</option><option>SHORT</option></select>
    <select id="f-status"><option value="">Status</option><option value="TP_HIT">TP atingido</option><option value="SL_HIT">SL atingido</option><option value="OPEN">Aberto</option></select>
    <input id="f-ticker" placeholder="Coin (ex: BTCUSDT.P)" style="width:160px"/>
  </div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>#</th><th>Coin</th><th>Lado</th><th>Entrada</th><th>TP</th><th>SL</th><th>Fecho</th><th>P&L</th><th>R:R</th><th>Status</th><th>Data</th>
      </tr></thead>
      <tbody id="trade-body"></tbody>
    </table>
  </div>
</div>

<script>
const API = "";
let allTrades = [];
let curve = [];

async function load() {
  const [trades, stats] = await Promise.all([
    fetch(API + "/api/trades").then(r => r.json()),
    fetch(API + "/api/stats").then(r => r.json()),
  ]);
  allTrades = trades;
  curve = stats.equity_curve || [];
  renderStats(stats);
  renderOpen(trades.filter(t => t.status === "OPEN"));
  renderTable(trades.filter(t => t.status !== "OPEN"));
  drawChart(curve);
  document.getElementById("last-update").textContent = "Atualizado: " + new Date().toLocaleTimeString("pt-PT");
}

function renderStats(s) {
  document.getElementById("s-total").textContent = s.total;
  document.getElementById("s-open").textContent = s.open;
  const wrEl = document.getElementById("s-wr");
  wrEl.textContent = s.win_rate + "%";
  wrEl.className = "val " + (s.win_rate >= 50 ? "green" : "red");
  const pfEl = document.getElementById("s-pf");
  pfEl.textContent = s.profit_factor !== null ? s.profit_factor : "—";
  pfEl.className = "val " + (s.profit_factor >= 1.5 ? "green" : s.profit_factor < 1 ? "red" : "orange");
  document.getElementById("s-wl").textContent = s.wins + " W / " + s.losses + " L";
  const pnlEl = document.getElementById("s-pnl");
  pnlEl.textContent = (s.total_pnl_pct >= 0 ? "+" : "") + s.total_pnl_pct + "%";
  pnlEl.className = "val " + (s.total_pnl_pct >= 0 ? "green" : "red");
  const lastEq = curve.length ? curve[curve.length-1].eq : 1000;
  document.getElementById("s-eq").textContent = lastEq.toLocaleString("pt-PT", {minimumFractionDigits:2}) + " USDT";
}

function renderOpen(trades) {
  const el = document.getElementById("open-list");
  if (!trades.length) { el.innerHTML = '<p style="color:#333;font-size:.8rem">Nenhum trade aberto.</p>'; return; }
  el.innerHTML = trades.map(t => {
    const range = Math.abs(t.tp_price - t.sl_price);
    const prog = range > 0 ? Math.min(100, Math.max(0, Math.abs(t.entry_price - t.sl_price) / range * 100)) : 0;
    const isLong = t.side === "LONG";
    return `<div class="open-card">
      <div class="top">
        <span class="ticker">${t.ticker.replace(".P","")}</span>
        <span class="badge ${t.side}">${t.side}</span>
      </div>
      <div class="levels">
        Entrada <span>${fmt(t.entry_price)}</span><br>
        TP <span class="green">${fmt(t.tp_price)}</span> &nbsp;
        SL <span class="red">${fmt(t.sl_price)}</span><br>
        R:R <span>${t.rr_ratio || calcRR(t)}</span> &nbsp;
        <span style="color:#444">${t.entry_time?.slice(0,16).replace("T"," ")}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${prog}%;background:${isLong?'#26a69a':'#ab47bc'}"></div></div>
    </div>`;
  }).join("");
}

function calcRR(t) {
  const risk = Math.abs(t.entry_price - t.sl_price);
  const reward = Math.abs(t.tp_price - t.entry_price);
  return risk > 0 ? (reward/risk).toFixed(2) : "—";
}

function fmt(v) { return v ? Number(v).toPrecision(6) : "—"; }

function renderTable(trades) {
  applyFilters(trades);
}

function applyFilters(src) {
  src = src || allTrades.filter(t => t.status !== "OPEN");
  const side = document.getElementById("f-side").value;
  const status = document.getElementById("f-status").value;
  const ticker = document.getElementById("f-ticker").value.toUpperCase();
  let rows = src;
  if (side) rows = rows.filter(t => t.side === side);
  if (status) rows = rows.filter(t => t.status === status);
  if (ticker) rows = rows.filter(t => t.ticker.includes(ticker));

  const tbody = document.getElementById("trade-body");
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="11" id="empty" style="color:#333;text-align:center;padding:32px">Sem trades para os filtros seleccionados.</td></tr>'; return; }

  tbody.innerHTML = rows.map(t => {
    const pnl = t.pnl_pct !== null ? t.pnl_pct : null;
    const pnlTxt = pnl !== null ? (pnl >= 0 ? "+" : "") + pnl.toFixed(2) + "%" : "—";
    const pnlCls = pnl === null ? "" : pnl >= 0 ? "pnl pos" : "pnl neg";
    return `<tr>
      <td style="color:#444">${t.id}</td>
      <td style="font-weight:600">${t.ticker.replace(".P","")}</td>
      <td><span class="badge ${t.side}">${t.side}</span></td>
      <td>${fmt(t.entry_price)}</td>
      <td class="green">${fmt(t.tp_price)}</td>
      <td class="red">${fmt(t.sl_price)}</td>
      <td>${fmt(t.close_price)}</td>
      <td class="${pnlCls}">${pnlTxt}</td>
      <td style="color:#666">${t.rr_ratio || calcRR(t)}</td>
      <td><span class="badge ${t.status}">${t.status === "TP_HIT" ? "✓ TP" : t.status === "SL_HIT" ? "✗ SL" : "•"}</span></td>
      <td style="color:#444">${t.entry_time?.slice(0,16).replace("T"," ")}</td>
    </tr>`;
  }).join("");
}

function drawChart(pts) {
  const canvas = document.getElementById("chart");
  const ctx = canvas.getContext("2d");
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 180 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const W = canvas.offsetWidth, H = 180;
  ctx.clearRect(0,0,W,H);

  if (pts.length < 2) {
    ctx.fillStyle = "#333"; ctx.font = "13px system-ui"; ctx.textAlign = "center";
    ctx.fillText("Sem dados suficientes para o gráfico", W/2, H/2);
    return;
  }

  const vals = pts.map(p => p.eq);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  const range = maxV - minV || 1;
  const pad = {t:16,b:24,l:60,r:16};
  const gW = W-pad.l-pad.r, gH = H-pad.t-pad.b;

  const x = i => pad.l + (i/(pts.length-1))*gW;
  const y = v => pad.t + gH - ((v-minV)/range)*gH;

  // Grid
  ctx.strokeStyle = "#1a1a1a"; ctx.lineWidth = 1;
  for (let i=0;i<4;i++) {
    const yy = pad.t + (i/3)*gH;
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(pad.l+gW,yy); ctx.stroke();
    const val = maxV - (i/3)*range;
    ctx.fillStyle="#444"; ctx.font="10px system-ui"; ctx.textAlign="right";
    ctx.fillText(val.toFixed(0), pad.l-6, yy+3);
  }

  // Gradient fill
  const grad = ctx.createLinearGradient(0,pad.t,0,pad.t+gH);
  const isUp = vals[vals.length-1] >= vals[0];
  grad.addColorStop(0, isUp ? "rgba(38,166,154,.35)" : "rgba(239,83,80,.35)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.beginPath();
  ctx.moveTo(x(0), y(vals[0]));
  pts.forEach((p,i) => { if(i>0) ctx.lineTo(x(i), y(p.eq)); });
  ctx.lineTo(x(pts.length-1), pad.t+gH);
  ctx.lineTo(x(0), pad.t+gH);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath();
  ctx.strokeStyle = isUp ? "#26a69a" : "#ef5350"; ctx.lineWidth = 2;
  pts.forEach((p,i) => i===0 ? ctx.moveTo(x(i),y(p.eq)) : ctx.lineTo(x(i),y(p.eq)));
  ctx.stroke();

  // Start / end labels
  ctx.fillStyle="#aaa"; ctx.font="10px system-ui"; ctx.textAlign="left";
  ctx.fillText(vals[0].toFixed(2), pad.l+4, pad.t+gH-4);
  ctx.textAlign="right";
  ctx.fillStyle = isUp ? "#26a69a" : "#ef5350";
  ctx.fillText(vals[vals.length-1].toFixed(2)+" USDT", pad.l+gW, pad.t+12);
}

// Filtros ao vivo
["f-side","f-status","f-ticker"].forEach(id =>
  document.getElementById(id).addEventListener("input", () => applyFilters())
);

// Auto-refresh a cada 30s
load();
setInterval(load, 30000);
</script>
</body>
</html>
